<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Load Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F10; --panel:#131A1C; --panel2:#0F1517; --line:#212B2D;
    --copper:#D98A4A; --copper-dim:#6B4527;
    --on:#5FD9A0; --off:#4A5456;
    --text:#EDEFEA; --muted:#7C8886;
    --mono:'JetBrains Mono', Consolas, monospace;
    --display:'Space Grotesk', -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text); font-family:var(--display); -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(217,138,74,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,138,74,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .wrap{max-width:480px; margin:0 auto; padding:10px 18px 40px;}

  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  header h1{font-size:1.05rem; font-weight:600; margin:0; letter-spacing:0.3px;}
  header h1 span{color:var(--copper);}
  .hdr-right{display:flex; align-items:center; gap:12px;}
  .hdr-left{display:flex; align-items:center; gap:10px;}
  .conn{font-family:var(--mono); font-size:0.68rem; color:var(--on); display:flex; align-items:center; gap:5px;}
  .dot{width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;}
  .gear{
    width:30px; height:30px; border-radius:8px; background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex-shrink:0;
  }
  .gear svg{width:16px; height:16px;}

  .menu-list{padding:6px 0;}
  .menu-item{
    display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    color:var(--text); font-family:var(--display); font-size:0.92rem; padding:14px 4px;
    text-align:left; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item svg{width:18px; height:18px; color:var(--copper); flex-shrink:0;}
  .menu-item span.sub{display:block; font-size:0.68rem; color:var(--muted); margin-top:2px; font-family:var(--display);}
  .account-status{font-family:var(--mono); font-size:0.68rem; color:var(--on); margin-bottom:10px;}

  .menu-header{display:flex; align-items:center; gap:12px; padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid var(--line);}
  .menu-logo{
    width:38px; height:38px; border-radius:10px; background:var(--copper-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .menu-logo svg{width:20px; height:20px; color:var(--copper);}
  .menu-header-text .name{font-weight:600; font-size:0.98rem;}
  .menu-header-text .tagline{font-size:0.68rem; color:var(--muted); margin-top:1px;}

  .menu-section-lbl{font-size:0.65rem; color:var(--muted); letter-spacing:0.6px; padding:12px 4px 4px;}
  .menu-item.danger{color:#E08A6B;}
  .menu-item.danger svg{color:#E08A6B;}

  .menu-footer{text-align:center; font-family:var(--mono); font-size:0.62rem; color:var(--muted); padding-top:10px; margin-top:4px; border-top:1px solid var(--line);}

  .gauge-wrap{
    position:relative; background:radial-gradient(circle at 50% 30%, var(--panel), var(--panel2));
    border:1px solid var(--line); border-radius:20px; padding:26px 20px 20px;
    display:flex; flex-direction:column; align-items:center; margin-bottom:16px;
  }
  .gauge-wrap svg.dial{width:220px; height:130px; overflow:visible;}
  .needle{transform-origin:110px 110px; transition:transform 0.9s cubic-bezier(.34,1.4,.4,1);}
  #gaugeFill{transition:stroke-dashoffset 0.9s cubic-bezier(.34,1.4,.4,1);}
  .gauge-figure{position:relative; display:flex; flex-direction:column; align-items:center;}
  .gauge-num{
    position:absolute; top:76px; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:1.9rem; font-weight:500; color:var(--copper);
  }
  .gauge-unit{
    position:absolute; top:112px; left:0; right:0; text-align:center;
    font-size:0.65rem; color:var(--muted); letter-spacing:1px;
  }
  .gauge-sub{
    display:flex; gap:22px; margin-top:6px; font-family:var(--mono); font-size:0.7rem; color:var(--muted);
  }
  .gauge-sub b{color:var(--text); font-weight:500;}

  .history-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:20px;
  }
  .history-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .history-top span{font-size:0.68rem; color:var(--muted); letter-spacing:0.3px;}
  .history-card svg{width:100%; height:44px; display:block;}

  .cumulative-btn{
    width:100%; display:flex; align-items:center; gap:12px;
    background:linear-gradient(135deg, #1A1410, #131A1C 60%);
    border:1px solid var(--copper-dim); border-radius:14px;
    padding:14px 16px; margin-bottom:18px; cursor:pointer; text-align:left;
    box-shadow:0 0 22px rgba(217,138,74,0.12), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .cumulative-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:radial-gradient(circle at 30% 30%, #F0A15C, #C97C3D 70%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 14px rgba(217,138,74,0.5);
  }
  .cumulative-icon svg{width:19px; height:19px; color:#1A1410;}
  .cumulative-text{flex:1; min-width:0;}
  .cumulative-label{font-size:0.6rem; color:var(--muted); letter-spacing:0.8px;}
  .cumulative-val{font-family:var(--mono); font-size:1.15rem; font-weight:600; color:var(--copper); margin-top:2px;}
  .cumulative-chevron{color:var(--muted); font-size:1.3rem; flex-shrink:0;}

  .usage-card, .token-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:16px;
  }
  .usage-top, .token-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .usage-top span, .token-top span{font-size:0.66rem; color:var(--muted); letter-spacing:0.5px;}
  .usage-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .usage-tabs button{
    flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-family:var(--mono); font-size:0.68rem; padding:7px 0; cursor:pointer;
  }
  .usage-tabs button.active{color:var(--copper); border-color:var(--copper-dim); background:rgba(217,138,74,0.08);}
  .usage-controls{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .usage-controls input[type="date"]{
    flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; color:var(--text); font-family:var(--mono); font-size:0.72rem;
  }
  .usage-controls span{font-size:0.68rem; color:var(--muted);}
  .usage-result{text-align:center;}
  .usage-val{font-family:var(--mono); font-size:1.3rem; font-weight:600; color:var(--copper);}
  .usage-sub{font-size:0.65rem; color:var(--muted); margin-top:2px;}

  .token-meter{font-family:var(--mono); font-size:0.68rem; color:var(--muted);}
  .token-val{font-family:var(--mono); font-size:1.4rem; font-weight:600; color:var(--copper); text-align:center; margin:4px 0;}
  .token-val.low{color:#E05C5C;}
  .token-last{text-align:center; font-size:0.62rem; color:var(--muted); font-family:var(--mono); margin-bottom:10px; word-break:break-all;}

  .section-lbl{font-size:0.72rem; color:var(--muted); margin:6px 2px 10px; letter-spacing:0.3px; display:flex; justify-content:space-between; align-items:center;}
  .master-toggle{
    background:var(--panel); border:1px solid rgba(224,92,92,0.35); border-radius:8px;
    color:#E05C5C; font-family:var(--mono); font-size:0.65rem; padding:5px 10px; cursor:pointer;
    transition:color 0.25s, border-color 0.25s;
  }
  .master-toggle.state-on{color:var(--on); border-color:var(--copper-dim);}

  .add-row{display:flex; gap:8px; margin-bottom:14px;}
  .add-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; color:var(--text); font-family:var(--display); font-size:0.88rem;
  }
  .add-row input::placeholder{color:var(--muted);}
  .add-row button{
    background:var(--copper-dim); border:none; border-radius:10px; padding:0 16px;
    color:var(--text); font-family:var(--display); font-weight:600; font-size:0.85rem; cursor:pointer;
  }

  .load-card{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 14px; margin-bottom:12px; overflow:hidden;
  }
  .load-card.active{border-color:var(--copper-dim);}
  .flow-line{
    position:absolute; left:16px; right:16px; top:0; height:2px;
    background:repeating-linear-gradient(90deg, var(--copper) 0 6px, transparent 6px 12px);
    background-size:200% 100%; opacity:0; transition:opacity 0.4s;
  }
  .load-card.active .flow-line{opacity:1; animation:flow 1.1s linear infinite;}
  @keyframes flow{ to{ background-position:-24px 0; } }

  .load-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px;}
  .load-name-row{display:flex; align-items:center; gap:10px; min-width:0;}
  .status-dot{
    width:14px; height:14px; border-radius:50%; flex-shrink:0;
    background:#E05C5C; box-shadow:0 0 6px rgba(224,92,92,0.6);
    transition:background 0.3s, box-shadow 0.3s;
  }
  .status-dot.on{background:#34C759; box-shadow:0 0 9px rgba(52,199,89,0.85);}
  .load-name{font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .remove-btn{background:none; border:none; color:var(--muted); font-size:0.9rem; cursor:pointer; padding:2px 4px; flex-shrink:0;}
  .load-sub{font-size:0.7rem; color:var(--muted); margin-top:1px; font-family:var(--mono);}

  .rocker{
    width:52px; height:30px; border-radius:8px; background:var(--off); border:1px solid var(--line);
    position:relative; cursor:pointer; flex-shrink:0;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
  }
  .rocker::after{
    content:'OFF'; position:absolute; inset:2px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:0.55rem; letter-spacing:0.5px; color:var(--muted);
    background:linear-gradient(180deg, #232D2F, #1A2224);
    transition:all 0.2s;
  }
  .rocker.on{background:var(--copper-dim);}
  .rocker.on::after{content:'ON'; color:#0B0F10; background:linear-gradient(180deg, var(--on), #46B885); font-weight:500;}

  .readout{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    font-family:var(--mono); border-top:1px solid var(--line); padding-top:12px; margin-bottom:10px;
  }
  .readout .r-val{font-size:0.98rem; color:var(--text);}
  .readout .r-val.dim{color:var(--muted); opacity:0.5;}
  .readout .r-lbl{font-size:0.62rem; color:var(--muted); margin-top:2px;}

  .autooff-row{display:flex; align-items:center; justify-content:space-between; font-size:0.72rem; color:var(--muted); border-top:1px solid var(--line); padding-top:10px;}
  .autooff-row select{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--text);
    font-family:var(--mono); font-size:0.7rem; padding:4px 6px;
  }
  .autooff-status{color:var(--copper); font-family:var(--mono);}

  .schedule-block{border-top:1px solid var(--line); padding-top:10px; margin-top:10px;}
  .schedule-row{display:flex; align-items:center; gap:8px; font-size:0.72rem; color:var(--muted); margin-bottom:8px;}
  .schedule-row:last-child{margin-bottom:0;}
  .schedule-row span{width:52px; flex-shrink:0;}
  .schedule-row select{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--text);
    font-family:var(--mono); font-size:0.68rem; padding:5px 6px; flex:1; min-width:0;
  }
  .schedule-row input[type="time"]{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--text);
    font-family:var(--mono); font-size:0.68rem; padding:5px 6px; width:88px; flex-shrink:0;
  }

  .log-title{font-size:0.72rem; color:var(--muted); margin:22px 2px 8px; letter-spacing:0.3px;}
  .log{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-family:var(--mono); font-size:0.7rem; color:var(--muted);
    max-height:110px; overflow-y:auto;
  }
  .log div{padding:2px 0; border-bottom:1px dashed rgba(255,255,255,0.04);}
  .log div:last-child{border-bottom:none;}

  .note{
    margin-top:20px; font-size:0.68rem; color:var(--muted); line-height:1.55;
    border-left:2px solid var(--copper-dim); padding-left:10px;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{display:flex;}
  #menuOverlay{align-items:flex-start; justify-content:flex-start; padding:calc(64px + env(safe-area-inset-top,0px)) 16px 0;}
  #menuOverlay .modal{width:auto; min-width:230px; max-width:260px; border-radius:14px; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));
    width:100%; max-width:480px;
  }
  .modal h2{font-size:1rem; margin:0 0 4px;}
  .modal p{font-size:0.72rem; color:var(--muted); margin:0 0 14px; line-height:1.5;}
  .modal label{font-size:0.7rem; color:var(--muted); display:block; margin-bottom:6px;}
  .modal input{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; color:var(--text); font-family:var(--mono); font-size:0.85rem; margin-bottom:14px;
  }
  .modal-btns{display:flex; gap:10px;}
  .modal-btns button{
    flex:1; border:none; border-radius:10px; padding:11px; font-family:var(--display); font-weight:600; font-size:0.85rem; cursor:pointer;
  }
  .btn-save{background:var(--copper-dim); color:var(--text);}
  .btn-close{background:var(--panel2); color:var(--muted); border:1px solid var(--line) !important;}
  .saved-ip{font-family:var(--mono); font-size:0.68rem; color:var(--on); margin-bottom:14px;}

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px !important;}
  .pw-toggle{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); cursor:pointer; padding:4px;
    display:flex; align-items:center; justify-content:center;
  }
  .pw-toggle svg{width:18px; height:18px;}

  .app-greyed{filter:grayscale(1) brightness(0.45); pointer-events:none; user-select:none; transition:filter 0.5s ease;}
  .wrap{transition:filter 0.5s ease;}

  .header-bar{max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;}
  #powerBtn{color:#E05C5C; border-color:rgba(224,92,92,0.35); cursor:pointer;}
  #powerBtn.power-on{color:var(--on); border-color:var(--copper-dim);}

  #accountOverlay{align-items:flex-start; justify-content:flex-end; padding:calc(64px + env(safe-area-inset-top,0px)) 16px 0;}
  #accountOverlay .modal{width:auto; min-width:210px; max-width:250px; border-radius:14px; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));}
  .profile-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--panel2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; margin:0 auto 10px;
  }
  .profile-avatar img{width:100%; height:100%; object-fit:cover;}
  .profile-avatar svg{width:24px; height:24px; color:var(--muted);}
  .profile-name{font-family:var(--mono); font-size:0.72rem; color:var(--text); margin-bottom:2px; word-break:break-all;}
  .profile-hint{font-size:0.62rem; color:var(--muted);}
  .header-avatar-thumb{width:100%; height:100%; border-radius:6px; object-fit:cover;}
</style>
</head>
<body>
<div class="header-bar">
  <header>
    <div class="hdr-left">
      <div class="gear" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
      <h1>Load<span>·</span>Control</h1>
    </div>
    <div class="hdr-right">
      <div class="conn"><span class="dot"></span></div>
      <button class="gear" id="powerBtn" title="System power">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>
      <div class="gear" id="accountBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </header>
</div>
<div class="wrap">

  <div class="gauge-wrap">
    <div class="gauge-figure">
      <svg class="dial" viewBox="0 0 220 130">
        <path d="M 10 110 A 100 100 0 0 1 210 110" fill="none" stroke="#212B2D" stroke-width="10" stroke-linecap="round"/>
        <path id="gaugeFill" d="M 10 110 A 100 100 0 0 1 210 110" fill="none" stroke="#D98A4A" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="314" stroke-dashoffset="314"/>
        <line class="needle" id="needle" x1="110" y1="110" x2="110" y2="28" stroke="#EDEFEA" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="6" fill="#EDEFEA"/>
      </svg>
      <div class="gauge-num" id="totalPower">0</div>
      <div class="gauge-unit" id="gaugeUnitLabel">WATTS DRAWN</div>
    </div>
    <div class="gauge-sub">
      <span><b id="loadsOn">0/0</b> loads on</span>
      <span><b id="uptime">00:00</b> session</span>
    </div>
  </div>

  <div class="history-card">
    <div class="history-top"><span>POWER HISTORY</span><span id="historyMax">max 0W</span></div>
    <svg id="historySvg" viewBox="0 0 300 44" preserveAspectRatio="none">
      <polyline id="historyLine" points="" fill="none" stroke="#D98A4A" stroke-width="1.5"/>
    </svg>
  </div>

  <button class="cumulative-btn" id="cumulativeBtn">
    <div class="cumulative-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 21 L11 13 L7 13 L13 3 L13 11 L17 11 Z"/></svg>
    </div>
    <div class="cumulative-text">
      <div class="cumulative-label">CUMULATIVE ENERGY</div>
      <div class="cumulative-val" id="cumulativeVal">0 Wh</div>
    </div>
    <div class="cumulative-chevron">›</div>
  </button>

  <div class="usage-card">
    <div class="usage-top"><span>TOTAL POWER USAGE</span></div>
    <div class="usage-tabs">
      <button data-period="day" class="active">Day</button>
      <button data-period="week">Week</button>
      <button data-period="custom">Custom</button>
    </div>
    <div class="usage-controls" id="usageDayControls">
      <input type="date" id="usageDayInput">
    </div>
    <div class="usage-controls" id="usageCustomControls" style="display:none;">
      <input type="date" id="usageFromInput">
      <span>to</span>
      <input type="date" id="usageToInput">
    </div>
