name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip | head -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d android
          echo "========== android/ =========="
          ls -la android/
          echo "========== android/app/ =========="
          ls -la android/app/ 2>&1 || echo "MISSING: android/app/"
          echo "========== android/app/build.gradle.kts =========="
          cat android/app/build.gradle.kts 2>&1 || echo "MISSING: app/build.gradle.kts"
          echo "========== android/settings.gradle.kts =========="
          cat android/settings.gradle.kts 2>&1 || echo "MISSING: settings.gradle.kts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: List available Gradle tasks
        run: gradle tasks --all --no-daemon || true
        working-directory: android

      - name: Build release
        run: gradle assembleRelease --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/release/app-release.apk
